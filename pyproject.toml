[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "used-car-tax-values"
version = "0.1.0"
description = "Local ingestion and validation for Verohallinto passenger-car tax-value workbooks"
requires-python = ">=3.13"
dependencies = ["xlrd>=2.0.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]
